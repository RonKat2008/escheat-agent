name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # One project (and so one `next dev` server) at a time. `pnpm e2e` booted all four dev servers at once; each grows
      # past 3 GB as routes compile, and the runner ran out of memory ~9 minutes in ("The operation was canceled").
      # Every project still runs when an earlier one fails; the step fails if any did.
      - name: Playwright, one project at a time
        run: |
          status=0
          for project in demo agents ui a11y; do
            echo "::group::playwright --project $project"
            pnpm exec playwright test --project "$project" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Memory diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE "out of memory|killed process" | tail -n 20 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
